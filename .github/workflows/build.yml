name: Build six platforms
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win
            arch: x64
            bundles: nsis
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win
            arch: arm64
            bundles: nsis
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: mac
            arch: x64
            bundles: dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: mac
            arch: arm64
            bundles: dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            bundles: appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb
      - run: npm ci
      - name: Synchronize version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs version "${{ inputs.version }}"
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build native package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installer
        run: node scripts/release.mjs collect ${{ matrix.target }} ${{ matrix.platform }} ${{ matrix.arch }} "${{ inputs.version }}"
      - name: Portable Windows package and launch check
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $binary = Resolve-Path 'src-tauri/target/${{ matrix.target }}/release/epub-series-metadata-editor.exe'
          Compress-Archive -LiteralPath $binary -DestinationPath '.artifacts/packages/EPUB-Metadata-Editor-${{ inputs.version }}-win-${{ matrix.arch }}-portable.zip'
          python scripts/smoke.py $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch macOS application
        if: matrix.platform == 'mac'
        run: python3 scripts/smoke.py src-tauri/target/${{ matrix.target }}/release/epub-series-metadata-editor
      - name: Launch Linux AppImage
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a python3 scripts/smoke.py .artifacts/packages/EPUB-Metadata-Editor-${{ inputs.version }}-linux-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: .artifacts/packages/*
          include-hidden-files: true
          if-no-files-found: error
