[package]
name = "epub-series-metadata-editor"
version = "2.0.0"
description = "EPUB Series Metadata Editor"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[features]
desktop-tests = []

[lib]
name = "epub_editor"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
